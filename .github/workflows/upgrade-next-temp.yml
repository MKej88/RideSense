name: Midlertidig Next.js-oppgradering

on:
  push:
    branches:
      - app-store-prep
    paths:
      - .github/workflows/upgrade-next-temp.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Hent branch
        uses: actions/checkout@v4
        with:
          ref: app-store-prep

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Oppgrader Next.js og ESLint-konfigurasjon
        run: npm install next@15.5.25 eslint-config-next@15.5.25 --save-exact

      - name: Commit generert lockfil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Next.js to patched 15.5.25"
          git push origin HEAD:app-store-prep
