name: Python-sjekker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kvalitet:
    name: Ruff og pytest
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer verktøy
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Ruff lint
        run: python -m ruff check scripts tests

      - name: Ruff format-sjekk
        run: python -m ruff format --check scripts tests

      - name: Pytest
        run: pytest -q

  typescript:
    name: TypeScript-sjekker
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer npm-pakker
        run: npm ci

      - name: ESLint (Next.js)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck
