name: Python-sjekker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  kvalitet:
    name: Ruff og pytest
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer verktøy
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Ruff lint
        run: python -m ruff check scripts tests

      - name: Ruff format-sjekk
        run: python -m ruff format --check scripts tests

      - name: Pytest
        run: pytest -q
