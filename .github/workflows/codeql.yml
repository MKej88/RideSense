name: CodeQL (JavaScript og TypeScript)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL-sikkerhetsanalyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v7
      - name: Start CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyser kode og publiser funn
        uses: github/codeql-action/analyze@v4
